<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Color & Card Workout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    body { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- HORNÁ LIŠTA (Časovač, Reset & Nastavenia) -->
  <header class="w-full max-w-xl mx-auto px-4 py-3 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]" id="wakeLockDot" title="Screen Wake Lock aktívny"></span>
      <h1 class="text-base font-bold tracking-wider uppercase text-slate-300">ColorFit</h1>
    </div>
    
    <div class="flex items-center gap-3">
      <div class="font-mono text-xl font-black text-amber-400" id="timerDisplay">00:00</div>
      
      <!-- Tlačidlo na ukončenie / reset tréningu -->
      <button id="btnResetWorkout" class="px-2.5 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900 border border-rose-800/60 text-rose-300 text-xs font-bold transition flex items-center gap-1" title="Ukončiť tréning">
        <span>⏹</span>
        <span>Ukončiť</span>
      </button>

      <button id="btnSettings" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition" title="Nastavenia">
        ⚙️
      </button>
    </div>
  </header>

  <!-- HLAVNÝ TRÉNINGOVÝ OBSAH -->
  <main class="flex-1 w-full max-w-xl mx-auto p-4 flex flex-col items-center justify-between gap-4">
    
    <!-- Progres a celkové opakovania -->
    <div class="w-full flex items-center justify-between text-xs font-mono text-slate-400 px-1">
      <span id="deckProgress">Zostáva: 0 / 0</span>
      <span id="totalRepsCount">Spolu opakovaní: 0</span>
    </div>

    <!-- KARTA -->
    <div class="w-full flex-1 flex items-center justify-center min-h-[380px] perspective-1000">
      <div id="cardElement" class="w-full max-w-sm aspect-[5/7] max-h-[500px] relative transform-style-3d transition-transform duration-500 cursor-pointer shadow-2xl rounded-3xl">
        
        <!-- Predná strana (Rub balíčka / Štart) -->
        <div id="cardBackFace" class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950 border-4 border-indigo-500/30 rounded-3xl flex flex-col items-center justify-center p-6 text-center shadow-inner backface-hidden">
          <div class="w-20 h-20 rounded-2xl bg-indigo-600/20 border border-indigo-400/40 flex items-center justify-center text-4xl mb-4">
            🃏
          </div>
          <h2 class="text-2xl font-black text-white tracking-wide uppercase">Pripravený?</h2>
          <p class="text-sm text-slate-400 mt-2 max-w-[220px]">Ťukni na kartu pre štart tréningu</p>
          <div class="mt-6 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-mono" id="modeBadge">
            Režim: 4 farby
          </div>
        </div>

        <!-- Zadná strana (Líc karty s cvikom) -->
        <div id="cardFrontFace" class="absolute inset-0 bg-white border-8 border-slate-200 rounded-3xl flex flex-col justify-between p-6 text-slate-950 backface-hidden rotate-y-180 shadow-2xl overflow-hidden">
          
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 font-black text-4xl" id="cornerSymbolTop">
              <span id="cardValueTop">10</span>
              <span id="cardSuitTop">♠</span>
            </div>
            <span class="text-xs uppercase font-bold tracking-widest px-2.5 py-1 rounded-md bg-slate-100/30 font-mono" id="cardCategoryTag">WOD</span>
          </div>

          <div class="text-center my-auto flex flex-col items-center">
            <div class="text-7xl sm:text-8xl font-black tracking-tighter my-1" id="cardMainValue">10</div>
            <div class="text-xs uppercase tracking-widest opacity-75 font-bold mb-1">opakovaní</div>
            <div class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight px-2 leading-tight" id="cardExerciseName">
              Kľuky
            </div>
          </div>

          <div class="flex items-center justify-between rotate-180">
            <div class="flex items-center gap-1.5 font-black text-4xl" id="cornerSymbolBottom">
              <span id="cardValueBottom">10</span>
              <span id="cardSuitBottom">♠</span>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- Spodné tlačidlo a súhrn -->
    <div class="w-full flex flex-col gap-3">
      <button id="btnNext" class="w-full py-4 bg-indigo-600 active:bg-indigo-700 hover:bg-indigo-500 text-white font-black text-lg tracking-wider uppercase rounded-2xl shadow-lg shadow-indigo-600/30 transition transform active:scale-[0.98]">
        Ďalšia karta
      </button>

      <div id="repsSummaryGrid" class="grid grid-cols-4 gap-2 text-center text-xs font-mono"></div>
    </div>

  </main>

  <!-- MODAL: NASTAVENIA TRÉNINGU -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden">
      
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
        <h2 class="text-lg font-bold text-white">Nastavenie tréningu</h2>
        <button id="btnCloseSettings" class="text-slate-400 hover:text-white p-1 text-xl font-bold">✕</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6 flex-1 text-sm">
        
        <!-- Výber režimu -->
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-2">Režim tréningu</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="modeBtnClassic" class="py-2.5 px-3 rounded-xl border font-semibold text-center border-indigo-500 bg-indigo-500/20 text-white">
              Klasický balíček
            </button>
            <button id="modeBtnCustom" class="py-2.5 px-3 rounded-xl border font-semibold text-center border-slate-700 bg-slate-800/60 text-slate-400">
              Farebný Arcade (do 10)
            </button>
          </div>
        </div>

        <!-- REŽIM 1: KLASICKÝ BALÍČEK (1 až 4 farby) -->
        <div id="classicOptions" class="space-y-4">
          <div>
            <label class="block text-xs uppercase font-bold text-slate-400 mb-2">Počet farieb v hre</label>
            <div class="grid grid-cols-4 gap-2">
              <button data-suits="1" class="suit-count-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-200 font-bold">1 (13k)</button>
              <button data-suits="2" class="suit-count-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-200 font-bold">2 (26k)</button>
              <button data-suits="3" class="suit-count-btn py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-200 font-bold">3 (39k)</button>
              <button data-suits="4" class="suit-count-btn py-2 rounded-lg border border-indigo-500 bg-indigo-500/20 text-white font-bold">4 (52k)</button>
            </div>
            <p class="text-[11px] text-slate-400 mt-1.5" id="suitEstimateDesc">4 farby: 52 kariet (~420 celkových opakovaní)</p>
          </div>

          <div class="space-y-2.5 pt-2">
            <label class="block text-xs uppercase font-bold text-slate-400">Priradenie cvikov k znakom</label>
            
            <div class="flex items-center gap-2 p-2 rounded-xl bg-slate-800/60 border border-slate-700/50" id="suitRow-spades">
              <span class="text-2xl text-slate-200 w-6 text-center">♠</span>
              <select id="select-spades" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-2 py-1.5 flex-1 text-xs font-medium"></select>
              <select id="mult-spades" class="bg-slate-900 border border-slate-700 text-slate-300 rounded-lg px-2 py-1.5 text-xs font-mono">
                <option value="1">1×</option>
                <option value="0.5">0.5×</option>
                <option value="2">2×</option>
              </select>
            </div>

            <div class="flex items-center gap-2 p-2 rounded-xl bg-slate-800/60 border border-slate-700/50" id="suitRow-hearts">
              <span class="text-2xl text-rose-500 w-6 text-center">♥</span>
              <select id="select-hearts" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-2 py-1.5 flex-1 text-xs font-medium"></select>
              <select id="mult-hearts" class="bg-slate-900 border border-slate-700 text-slate-300 rounded-lg px-2 py-1.5 text-xs font-mono">
                <option value="1">1×</option>
                <option value="0.5">0.5×</option>
                <option value="2">2×</option>
              </select>
            </div>

            <div class="flex items-center gap-2 p-2 rounded-xl bg-slate-800/60 border border-slate-700/50" id="suitRow-diamonds">
              <span class="text-2xl text-rose-500 w-6 text-center">♦</span>
              <select id="select-diamonds" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-2 py-1.5 flex-1 text-xs font-medium"></select>
              <select id="mult-diamonds" class="bg-slate-900 border border-slate-700 text-slate-300 rounded-lg px-2 py-1.5 text-xs font-mono">
                <option value="1">1×</option>
                <option value="0.5">0.5×</option>
                <option value="2">2×</option>
              </select>
            </div>

            <div class="flex items-center gap-2 p-2 rounded-xl bg-slate-800/60 border border-slate-700/50" id="suitRow-clubs">
              <span class="text-2xl text-slate-200 w-6 text-center">♣</span>
              <select id="select-clubs" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-2 py-1.5 flex-1 text-xs font-medium"></select>
              <select id="mult-clubs" class="bg-slate-900 border border-slate-700 text-slate-300 rounded-lg px-2 py-1.5 text-xs font-mono">
                <option value="1">1×</option>
                <option value="0.5">0.5×</option>
                <option value="2">2×</option>
              </select>
            </div>
          </div>
        </div>

        <!-- REŽIM 2: FAREBNÝ ARCADE S PRIRAĎOVANÍM CVIKOV -->
        <div id="customColorOptions" class="space-y-4 hidden">
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[11px] uppercase font-bold text-slate-400 mb-1">Počet farieb</label>
              <input type="number" id="customColorCount" min="2" max="10" value="5" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white font-mono text-center">
            </div>
            <div>
              <label class="block text-[11px] uppercase font-bold text-slate-400 mb-1">Max opakovaní</label>
              <input type="number" id="customMaxReps" min="5" max="50" value="20" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white font-mono text-center">
            </div>
            <div>
              <label class="block text-[11px] uppercase font-bold text-slate-400 mb-1">Veľkosť balíčka</label>
              <input type="number" id="customDeckSize" min="10" max="100" value="30" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white font-mono text-center">
            </div>
          </div>

          <!-- Dynamicky generovaný zoznam pre priradenie cvikov jednotlivým farbám -->
          <div class="space-y-2 pt-2">
            <label class="block text-xs uppercase font-bold text-slate-400">Priradenie cvikov k jednotlivým farbám</label>
            <div id="arcadeColorAssignments" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
          </div>
        </div>

      </div>

      <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex gap-2">
        <button id="btnSaveRestart" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition">
          Uložiť a začať tréning
        </button>
      </div>

    </div>
  </div>

  <script>
    // KNIŽNICA CVIKOV
    const EXERCISE_LIBRARY = [
      { name: "Push-ups (Kľuky)", mult: 1 },
      { name: "Pull-ups (Zhyby)", mult: 0.5 },
      { name: "Dips (Bradlá / Kruhy)", mult: 0.5 },
      { name: "Squats (Drepy)", mult: 1 },
      { name: "Pistol Squats (Jednonohé drepy)", mult: 0.5 },
      { name: "Lunges (Výpady)", mult: 1 },
      { name: "Burpees (Angličáky)", mult: 1 },
      { name: "V-Ups / Brucho", mult: 1 },
      { name: "Deadlift (Mŕtvy ťah)", mult: 0.5 },
      { name: "Clean (Premiestnenie)", mult: 0.5 },
      { name: "Clean & Jerk", mult: 0.5 },
      { name: "Push Press / Výtlak s činkou", mult: 0.5 },
      { name: "Thruster", mult: 0.5 },
      { name: "Kettlebell Swing", mult: 1 }
    ];

    // PALETA FARIEB PRE ARCADE
    const ARCADE_COLORS = [
      { id: 0, name: 'Červená', hex: '#ef4444', text: 'text-white' },
      { id: 1, name: 'Modrá', hex: '#3b82f6', text: 'text-white' },
      { id: 2, name: 'Zelená', hex: '#10b981', text: 'text-white' },
      { id: 3, name: 'Žltá', hex: '#eab308', text: 'text-slate-950' },
      { id: 4, name: 'Fialová', hex: '#8b5cf6', text: 'text-white' },
      { id: 5, name: 'Ružová', hex: '#ec4899', text: 'text-white' },
      { id: 6, name: 'Tyrkysová', hex: '#06b6d4', text: 'text-slate-950' },
      { id: 7, name: 'Oranžová', hex: '#f97316', text: 'text-white' },
      { id: 8, name: 'Limetková', hex: '#84cc16', text: 'text-slate-950' },
      { id: 9, name: 'Sivá', hex: '#64748b', text: 'text-white' }
    ];

    // STAV
    let state = {
      mode: 'classic',
      suitCount: 4,
      deck: [],
      currentCard: null,
      history: [],
      timerSeconds: 0,
      timerRunning: false,
      timerInterval: null,
      wakeLock: null,
      repsMap: {},
      suitsConfig: {
        '♠': { exercise: 'Push-ups (Kľuky)', mult: 1, color: 'text-slate-900' },
        '♥': { exercise: 'Squats (Drepy)', mult: 1, color: 'text-rose-600' },
        '♦': { exercise: 'V-Ups / Brucho', mult: 1, color: 'text-rose-600' },
        '♣': { exercise: 'Burpees (Angličáky)', mult: 1, color: 'text-slate-900' }
      },
      arcadeConfig: {
        count: 5,
        maxReps: 20,
        deckSize: 30,
        colorAssignments: [
          { exercise: 'Push-ups (Kľuky)', mult: 1 },
          { exercise: 'Pull-ups (Zhyby)', mult: 0.5 },
          { exercise: 'Squats (Drepy)', mult: 1 },
          { exercise: 'Thruster', mult: 0.5 },
          { exercise: 'Burpees (Angličáky)', mult: 1 },
          { exercise: 'V-Ups / Brucho', mult: 1 },
          { exercise: 'Kettlebell Swing', mult: 1 },
          { exercise: 'Lunges (Výpady)', mult: 1 },
          { exercise: 'Clean & Jerk', mult: 0.5 },
          { exercise: 'Dips (Bradlá / Kruhy)', mult: 0.5 }
        ]
      }
    };

    function playBeep(freq = 600, duration = 0.08) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !state.wakeLock) {
          state.wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    // NAPLNENIE ZÁKLADNÝCH SELECTOV
    function populateClassicSelects() {
      ['spades', 'hearts', 'diamonds', 'clubs'].forEach(suit => {
        const select = document.getElementById(`select-${suit}`);
        select.innerHTML = '';
        EXERCISE_LIBRARY.forEach(ex => {
          const opt = document.createElement('option');
          opt.value = ex.name;
          opt.textContent = ex.name;
          select.appendChild(opt);
        });
      });
      document.getElementById('select-spades').value = state.suitsConfig['♠'].exercise;
      document.getElementById('select-hearts').value = state.suitsConfig['♥'].exercise;
      document.getElementById('select-diamonds').value = state.suitsConfig['♦'].exercise;
      document.getElementById('select-clubs').value = state.suitsConfig['♣'].exercise;
    }

    // DYNAMICKÉ GENEROVANIE FARIEB PRE ARCADE
    function renderArcadeColorAssignmentRows() {
      const container = document.getElementById('arcadeColorAssignments');
      container.innerHTML = '';
      const count = Math.min(10, Math.max(2, parseInt(document.getElementById('customColorCount').value) || 5));

      for (let i = 0; i < count; i++) {
        const color = ARCADE_COLORS[i];
        const assigned = state.arcadeConfig.colorAssignments[i] || { exercise: EXERCISE_LIBRARY[i % EXERCISE_LIBRARY.length].name, mult: 1 };
        
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 p-2 rounded-xl bg-slate-800/60 border border-slate-700/50';
        row.innerHTML = `
          <span class="w-5 h-5 rounded-full flex-shrink-0 shadow-sm" style="background-color: ${color.hex}"></span>
          <select id="arcadeSelect-${i}" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-2 py-1.5 flex-1 text-xs font-medium">
            ${EXERCISE_LIBRARY.map(ex => `<option value="${ex.name}" ${ex.name === assigned.exercise ? 'selected' : ''}>${ex.name}</option>`).join('')}
          </select>
          <select id="arcadeMult-${i}" class="bg-slate-900 border border-slate-700 text-slate-300 rounded-lg px-2 py-1.5 text-xs font-mono">
            <option value="1" ${assigned.mult === 1 ? 'selected' : ''}>1×</option>
            <option value="0.5" ${assigned.mult === 0.5 ? 'selected' : ''}>0.5×</option>
            <option value="2" ${assigned.mult === 2 ? 'selected' : ''}>2×</option>
          </select>
        `;
        container.appendChild(row);
      }
    }

    document.getElementById('customColorCount').addEventListener('input', renderArcadeColorAssignmentRows);

    // GENEROVANIE BALÍČKA
    function generateDeck() {
      let cards = [];
      state.repsMap = {};

      if (state.mode === 'classic') {
        const activeSuits = ['♠', '♥', '♦', '♣'].slice(0, state.suitCount);
        const cardRanks = [
          { rank: '2', val: 2 }, { rank: '3', val: 3 }, { rank: '4', val: 4 },
          { rank: '5', val: 5 }, { rank: '6', val: 6 }, { rank: '7', val: 7 },
          { rank: '8', val: 8 }, { rank: '9', val: 9 }, { rank: '10', val: 10 },
          { rank: 'J', val: 10 }, { rank: 'Q', val: 10 }, { rank: 'K', val: 10 },
          { rank: 'A', val: 11 }
        ];

        activeSuits.forEach(suit => {
          const config = state.suitsConfig[suit];
          state.repsMap[suit] = 0;
          cardRanks.forEach(r => {
            const calculatedReps = Math.max(1, Math.round(r.val * config.mult));
            cards.push({
              suit: suit,
              rank: r.rank,
              reps: calculatedReps,
              exercise: config.exercise,
              textColor: config.color,
              bgColor: '#ffffff',
              isCustomColor: false
            });
          });
        });
      } else {
        // Arcade režim
        const count = state.arcadeConfig.count;
        for (let i = 0; i < count; i++) {
          state.repsMap[i] = 0;
        }

        for (let i = 0; i < state.arcadeConfig.deckSize; i++) {
          const colorIndex = Math.floor(Math.random() * count);
          const colorObj = ARCADE_COLORS[colorIndex];
          const assigned = state.arcadeConfig.colorAssignments[colorIndex];
          
          const rawReps = Math.floor(Math.random() * state.arcadeConfig.maxReps) + 1;
          const calculatedReps = Math.max(1, Math.round(rawReps * assigned.mult));

          cards.push({
            suit: '●',
            rank: calculatedReps.toString(),
            reps: calculatedReps,
            exercise: assigned.exercise,
            textColor: colorObj.text,
            bgColor: colorObj.hex,
            isCustomColor: true,
            colorIndex: colorIndex
          });
        }
      }

      // Zamiešanie (Fisher-Yates)
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }

      state.deck = cards;
      state.history = [];
      state.currentCard = null;
      updateUI();
    }

    // ĎALŠIA KARTA
    function nextCard() {
      if (!state.timerRunning) startTimer();
      requestWakeLock();

      if (state.deck.length === 0) {
        finishWorkout();
        return;
      }

      const card = state.deck.pop();
      state.history.push(card);
      state.currentCard = card;

      if (card.isCustomColor) {
        state.repsMap[card.colorIndex] = (state.repsMap[card.colorIndex] || 0) + card.reps;
      } else {
        state.repsMap[card.suit] = (state.repsMap[card.suit] || 0) + card.reps;
      }

      renderCurrentCard(card);
      updateUI();
      playBeep(650, 0.06);
    }

    // VYKRESLENIE KARTY
    function renderCurrentCard(card) {
      const cardEl = document.getElementById('cardElement');
      const frontFace = document.getElementById('cardFrontFace');

      if (card.isCustomColor) {
        frontFace.style.backgroundColor = card.bgColor;
        frontFace.className = `absolute inset-0 border-8 border-white/20 rounded-3xl flex flex-col justify-between p-6 backface-hidden rotate-y-180 shadow-2xl ${card.textColor}`;
      } else {
        frontFace.style.backgroundColor = '#ffffff';
        frontFace.className = `absolute inset-0 border-8 border-slate-200 rounded-3xl flex flex-col justify-between p-6 backface-hidden rotate-y-180 shadow-2xl ${card.textColor}`;
      }

      document.getElementById('cardValueTop').textContent = card.rank;
      document.getElementById('cardSuitTop').textContent = card.suit;
      document.getElementById('cardValueBottom').textContent = card.rank;
      document.getElementById('cardSuitBottom').textContent = card.suit;
      document.getElementById('cardMainValue').textContent = card.reps;
